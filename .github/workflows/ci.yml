name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["18.17", 18, 20, 22]
        include:
          - os: windows-latest
            node: 22
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # pretest builds dist/server.mjs; the suite includes the bundle tests.
      - run: npm test
      - name: Package contents
        run: npm pack --dry-run
      - name: Install the packed tarball alone and start it
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/install"
          cd "$RUNNER_TEMP/install"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/cintelisai-adsoptimiser-mcp-*.tgz --no-audit --no-fund
          node -e "const n = Object.keys(require('./node_modules/.package-lock.json').packages).length; console.log(n + ' package(s) installed'); if (n !== 1) process.exit(1);"
          node "$GITHUB_WORKSPACE/scripts/smoke.mjs" node_modules/@cintelisai/adsoptimiser-mcp/dist/server.mjs
